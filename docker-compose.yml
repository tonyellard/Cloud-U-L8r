services:
  essthree:
    build:
      context: .
      dockerfile: services/essthree/Dockerfile
    container_name: essthree
    ports:
      - "9300:9300"
    volumes:
      - ./services/essthree/data:/data
    environment:
      - DATA_DIR=/data
      - TZ=UTC
    restart: unless-stopped
    networks:
      - shared-network

  cloudfauxnt:
    build:
      context: .
      dockerfile: services/cloudfauxnt/Dockerfile
    container_name: cloudfauxnt
    ports:
      - "9310:9310"
    volumes:
      - ./config:/app/config:ro
      - ./services/cloudfauxnt/keys:/app/keys:ro
    environment:
      - TZ=UTC
    restart: unless-stopped
    command: ["./cloudfauxnt", "--config", "/app/config/cloudfauxnt.config.yaml"]
    depends_on:
      - essthree
    networks:
      - shared-network

  ess-queue-ess:
    build:
      context: .
      dockerfile: services/ess-queue-ess/Dockerfile
    container_name: ess-queue-ess
    ports:
      - "9320:9320"
    environment:
      - PORT=9320
    volumes:
      - ./services/ess-queue-ess/data:/app/data
      - ./config:/app/config:ro
    command: ["./ess-queue-ess", "--config", "/app/config/ess-queue-ess.config.yaml"]
    networks:
      - shared-network

  ess-enn-ess:
    build:
      context: .
      dockerfile: services/ess-enn-ess/Dockerfile
    container_name: ess-enn-ess
    ports:
      - "9330:9330"
    volumes:
      - ./config:/app/config:ro
      - ./services/ess-enn-ess/data:/app/data
    command: ["-config", "/app/config/ess-enn-ess.config.yaml"]
    networks:
      - shared-network
    depends_on:
      - ess-queue-ess

  kay-vee:
    build:
      context: .
      dockerfile: services/kay-vee/Dockerfile
    container_name: kay-vee
    ports:
      - "9350:9350"
    environment:
      - PORT=9350
    networks:
      - shared-network

  drawbridge:
    build:
      context: .
      dockerfile: services/drawbridge/Dockerfile
    container_name: drawbridge
    ports:
      - "9340:9340"
    environment:
      - PORT=9340
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
    networks:
      - shared-network

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: scheduler
    ports:
      - "9342:9342"
    environment:
      - PORT=9342
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
    networks:
      - shared-network

  pipes:
    build:
      context: .
      dockerfile: services/pipes/Dockerfile
    container_name: pipes
    ports:
      - "9344:9344"
    environment:
      - PORT=9344
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
      - EVENTBRIDGE_ENDPOINT=http://drawbridge:9340
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
      - drawbridge
    networks:
      - shared-network

  admin-console:
    build:
      context: .
      dockerfile: services/admin-console/Dockerfile
    container_name: admin-console
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
      - kay-vee
      - drawbridge
      - scheduler
      - pipes
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
