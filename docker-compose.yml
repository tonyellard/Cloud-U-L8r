services:
  essthree:
    build:
      context: .
      dockerfile: services/essthree/Dockerfile
    container_name: essthree
    ports:
      - "9300:9300"
    volumes:
      - ./services/essthree/data:/data
    environment:
      - DATA_DIR=/data
      - TZ=UTC
    restart: unless-stopped
    networks:
      - shared-network

  cloudfauxnt:
    build:
      context: .
      dockerfile: services/cloudfauxnt/Dockerfile
    container_name: cloudfauxnt
    ports:
      - "9310:9310"
    volumes:
      - ./services/cloudfauxnt/keys:/app/keys:ro
    environment:
      - TZ=UTC
      - PORT=9310
      - HOST=0.0.0.0
      - CORS_ENABLED=true
      - SIGNING_ENABLED=true
      - SIGNING_KEY_PAIR_ID=APKAJEXAMPLE123456
      - SIGNING_PUBLIC_KEY_PATH=/app/keys/public.pem
      - ORIGINS=[{"name":"s3","url":"http://essthree:9300","path_patterns":["/test-bucket/*"],"require_signature":false,"default_root_object":"index.html"}]
    restart: unless-stopped
    depends_on:
      - essthree
    networks:
      - shared-network

  ess-queue-ess:
    build:
      context: .
      dockerfile: services/ess-queue-ess/Dockerfile
    container_name: ess-queue-ess
    ports:
      - "9320:9320"
    environment:
      - PORT=9320
    volumes:
      - ./services/ess-queue-ess/data:/app/data
    networks:
      - shared-network

  ess-enn-ess:
    build:
      context: .
      dockerfile: services/ess-enn-ess/Dockerfile
    container_name: ess-enn-ess
    ports:
      - "9330:9330"
    volumes:
      - ./services/ess-enn-ess/data:/app/data
    environment:
      - API_PORT=9330
      - ADMIN_PORT=9331
      - HOST=0.0.0.0
      - REGION=us-east-1
      - ACCOUNT_ID=123456789012
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SQS_ENABLED=true
      - AUTO_CONFIRM_SUBSCRIPTIONS=true
    networks:
      - shared-network
    depends_on:
      - ess-queue-ess

  kay-vee:
    build:
      context: .
      dockerfile: services/kay-vee/Dockerfile
    container_name: kay-vee
    ports:
      - "9350:9350"
    environment:
      - PORT=9350
    networks:
      - shared-network

  drawbridge:
    build:
      context: .
      dockerfile: services/drawbridge/Dockerfile
    container_name: drawbridge
    ports:
      - "9340:9340"
    environment:
      - PORT=9340
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
    networks:
      - shared-network

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: scheduler
    ports:
      - "9342:9342"
    environment:
      - PORT=9342
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
    networks:
      - shared-network

  pipes:
    build:
      context: .
      dockerfile: services/pipes/Dockerfile
    container_name: pipes
    ports:
      - "9344:9344"
    environment:
      - PORT=9344
      - REGION=us-east-1
      - ACCOUNT_ID=000000000000
      - SQS_ENDPOINT=http://ess-queue-ess:9320
      - SNS_ENDPOINT=http://ess-enn-ess:9330
      - EVENTBRIDGE_ENDPOINT=http://drawbridge:9340
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
      - drawbridge
    networks:
      - shared-network

  admin-console:
    build:
      context: .
      dockerfile: services/admin-console/Dockerfile
    container_name: admin-console
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
    depends_on:
      - ess-queue-ess
      - ess-enn-ess
      - kay-vee
      - drawbridge
      - scheduler
      - pipes
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
